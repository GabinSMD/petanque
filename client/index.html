<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d3d9c" />
    <meta
      name="description"
      content="Gestion de concours de pétanque : poules, tableaux, consolante, tir de précision — fonctionne sans connexion."
    />
    <!-- L'application n'a rien à faire dans un moteur de recherche : c'est la
         page vitrine (vitrine.html) qui est référencée, et les pages publiques
         d'un concours n'ont d'intérêt que le jour où il se joue. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS : application plein écran ajoutée à l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pétanque" />
    <title>Pétanque Concours</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
