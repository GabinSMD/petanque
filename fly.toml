# Déploiement Fly.io — voir docs/DEPLOIEMENT.md
# 1. fly launch --no-deploy   (ou renommez `app` ci-dessous)
# 2. fly volumes create petanque_data --size 1
# 3. fly secrets set JWT_SECRET=$(openssl rand -hex 32)
# 4. fly deploy

app = "petanque-concours"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "8787"

[[mounts]]
  source = "petanque_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"
